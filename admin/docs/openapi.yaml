openapi: 3.1.0
info:
  title: Claude-Mem Admin API
  version: 1.0.0
  description: Management plane for claude-mem teams, projects, API keys, observations and jobs.

servers:
  - url: http://localhost:5200
    description: Local development

security:
  - ApiKeyAuth: []

paths:
  # ── Teams ──────────────────────────────────────────────────────────────────
  /teams:
    get:
      operationId: GetTeams
      summary: List teams (cursor-paginated)
      tags: [Teams]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '401':
          description: Missing or invalid API key
        default:
          $ref: '#/components/responses/ProblemDetailsError'

    post:
      operationId: CreateTeam
      summary: Create a team
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          description: Missing or invalid API key
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        default:
          $ref: '#/components/responses/ProblemDetailsError'

  /teams/{team_id}:
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetTeam
      summary: Get a team by ID
      tags: [Teams]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          description: Missing or invalid API key
        default:
          $ref: '#/components/responses/ProblemDetailsError'

  # ── Projects ───────────────────────────────────────────────────────────────
  /teams/{team_id}/projects:
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetProjects
      summary: List projects for a team
      tags: [Projects]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          description: Missing or invalid API key
        default:
          $ref: '#/components/responses/ProblemDetailsError'

    post:
      operationId: CreateProject
      summary: Create a project in a team
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Missing or invalid API key
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        default:
          $ref: '#/components/responses/ProblemDetailsError'

  /teams/{team_id}/projects/{project_id}:
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetProject
      summary: Get a project by ID
      tags: [Projects]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Missing or invalid API key
        default:
          $ref: '#/components/responses/ProblemDetailsError'

  # ── API Keys ───────────────────────────────────────────────────────────────
  /teams/{team_id}/projects/{project_id}/api-keys:
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetApiKeys
      summary: List API keys for a project
      tags: [ApiKeys]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
        '401':
          description: Missing or invalid API key
        default:
          $ref: '#/components/responses/ProblemDetailsError'

    post:
      operationId: CreateApiKey
      summary: Create a new API key for a project
      tags: [ApiKeys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKey'
      responses:
        '201':
          description: Created — key is shown once only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewApiKey'
        '401':
          description: Missing or invalid API key
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        default:
          $ref: '#/components/responses/ProblemDetailsError'

  /teams/{team_id}/projects/{project_id}/api-keys/{key_id}:
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: key_id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: DeleteApiKey
      summary: Revoke an API key
      tags: [ApiKeys]
      responses:
        '204':
          description: Revoked
        '401':
          description: Missing or invalid API key
        default:
          $ref: '#/components/responses/ProblemDetailsError'

  # ── Observations ───────────────────────────────────────────────────────────
  /teams/{team_id}/projects/{project_id}/observations:
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: GetObservations
      summary: List observations for a project
      tags: [Observations]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: q
          in: query
          description: Full-text search filter
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationPage'
        '401':
          description: Missing or invalid API key
        default:
          $ref: '#/components/responses/ProblemDetailsError'

  # ── Jobs ───────────────────────────────────────────────────────────────────
  /jobs:
    get:
      operationId: GetJobs
      summary: List recent jobs across all projects
      tags: [Jobs]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '401':
          description: Missing or invalid API key
        default:
          $ref: '#/components/responses/ProblemDetailsError'

  /jobs/{job_id}/retry:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: RetryJob
      summary: Re-enqueue a failed job
      tags: [Jobs]
      responses:
        '204':
          description: Job re-queued
        '401':
          description: Missing or invalid API key
        default:
          $ref: '#/components/responses/ProblemDetailsError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key

  responses:
    ProblemDetailsError:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    # ── Pagination ────────────────────────────────────────────────────────────
    ResponsePage:
      type: object
      required:
        - self
        - first
      properties:
        self:
          type: string
          format: uri
          description: Link to the current page.
        first:
          type: string
          format: uri
          description: Link to the first page.
        next:
          type: string
          format: uri
          nullable: true
          description: Link to the next page. Absent on the last page.

    # ── Teams ─────────────────────────────────────────────────────────────────
    Team:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 256
        created_at:
          type: string
          format: date-time
          readOnly: true
        project_count:
          type: integer
          format: int64
          nullable: true
          readOnly: true
          description: Populated in detail view, null in list view.
      required:
        - name

    TeamPage:
      allOf:
        - $ref: '#/components/schemas/ResponsePage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Team'
          required: [items]

    # ── Projects ──────────────────────────────────────────────────────────────
    Project:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        team_id:
          type: string
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 256
        created_at:
          type: string
          format: date-time
          readOnly: true
        api_key_count:
          type: integer
          format: int64
          nullable: true
          readOnly: true
          description: Populated in detail view, null in list view.
        observation_count:
          type: integer
          format: int64
          nullable: true
          readOnly: true
          description: Populated in detail view, null in list view.
      required:
        - name

    ProjectPage:
      allOf:
        - $ref: '#/components/schemas/ResponsePage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Project'
          required: [items]

    # ── API Keys ──────────────────────────────────────────────────────────────
    ApiKey:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        project_id:
          type: string
          readOnly: true
        actor_id:
          type: string
          minLength: 1
          maxLength: 256
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - actor_id

    ApiKeyPage:
      allOf:
        - $ref: '#/components/schemas/ResponsePage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ApiKey'
          required: [items]

    NewApiKey:
      type: object
      description: Returned once on creation. Contains the plaintext key which is never retrievable again.
      properties:
        id:
          type: string
        actor_id:
          type: string
        key:
          type: string
          description: Full API key — shown once only, never retrievable again.
        created_at:
          type: string
          format: date-time
      required: [id, actor_id, key, created_at]

    # ── Observations ──────────────────────────────────────────────────────────
    Observation:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        project_id:
          type: string
          readOnly: true
        content:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    ObservationPage:
      allOf:
        - $ref: '#/components/schemas/ResponsePage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Observation'
          required: [items]

    # ── Jobs ──────────────────────────────────────────────────────────────────
    Job:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        project_id:
          type: string
          nullable: true
          readOnly: true
        status:
          type: string
          readOnly: true
          description: Job status as reported by the upstream system. Not an enum — the upstream may add values at any time.
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        failed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    JobPage:
      allOf:
        - $ref: '#/components/schemas/ResponsePage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Job'
          required: [items]

    # ── Problem Details ───────────────────────────────────────────────────────
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
